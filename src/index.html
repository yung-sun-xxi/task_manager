<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local Chat · Llama (Ollama)</title>
  <style>
    :root { --bg:#0f1115; --panel:#151822; --text:#e6e8ef; --muted:#9aa3b2; --accent:#7aa2f7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial; }
    header { position:sticky; top:0; background:rgba(21,24,34,0.85); backdrop-filter:saturate(140%) blur(10px); padding:12px 16px; border-bottom:1px solid #222735; }
    header h1 { margin:0; font-size:16px; letter-spacing:.2px; }
    .wrap { display:flex; height:calc(100vh - 58px); }
    .chat { flex:1; display:flex; flex-direction:column; }
    .msgs { flex:1; overflow:auto; padding:16px; }
    .msg { max-width:900px; margin:0 auto 14px; padding:14px 16px; border-radius:12px; background:var(--panel); box-shadow:0 1px 0 #0c0e14 inset, 0 0 1px rgba(255,255,255,0.03) inset; }
    .msg.user { border:1px solid #2c3344; }
    .msg.assistant { border:1px solid #24304a; }
    .meta { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:6px; }
    .content { white-space:pre-wrap; }
    .toolbar { display:flex; gap:8px; align-items:center; padding:10px; border-top:1px solid #222735; background:linear-gradient(180deg, rgba(10,12,17,.3), rgba(10,12,17,.1)); }
    .toolbar textarea { flex:1; resize:vertical; min-height:48px; max-height:160px; padding:10px; border-radius:10px; border:1px solid #273043; background:#0c0f17; color:var(--text); outline:none; }
    .toolbar button { border:1px solid #2b3550; background:#192136; color:#cfd7ea; padding:10px 14px; border-radius:10px; cursor:pointer; }
    .toolbar button:hover { background:#202b46; }
    .btn { font-size:12px; padding:6px 10px; border:1px solid #2a3347; background:#131a29; color:#c6d0e6; border-radius:8px; cursor:pointer; }
    .btn:hover { background:#182138; }
    .row { display:flex; gap:8px; align-items:center; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Local chat → model: <span id="model" class="muted">llama32-3b-32k</span></h1>
  </header>
  <div class="wrap">
    <div class="chat">
      <div id="msgs" class="msgs"></div>
      <div class="toolbar">
        <textarea id="input" placeholder="Type a message… (Shift+Enter = newline)"></textarea>
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Simple front-end that talks to /api/chat on our local server.
    const API_URL = '/api/chat';
    const msgsEl = document.getElementById('msgs');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Keep a running conversation so the model has context.
    // Ollama expects: [{ role: 'user'|'assistant'|'system', content: '...' }, ...]
    let history = [];

    function addMsg(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<div>${role === 'user' ? 'You' : 'Assistant'}</div>`;

      const row = document.createElement('div');
      row.className = 'row';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = async () => {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied';
        setTimeout(() => copyBtn.textContent = 'Copy', 1200);
      };

      row.appendChild(document.createElement('div'));
      row.appendChild(copyBtn);
      meta.appendChild(row);

      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = text;

      el.appendChild(meta);
      el.appendChild(content);
      msgsEl.appendChild(el);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      addMsg('user', text);

      history.push({ role: 'user', content: text });

      try {
        const r = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await r.json();
        const answer = data.content || '(empty)';
        addMsg('assistant', answer);
        history.push({ role: 'assistant', content: answer });
      } catch (e) {
        addMsg('assistant', 'Error: ' + e);
      }
    }

    sendBtn.onclick = send;
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
